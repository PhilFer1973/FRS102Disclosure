[project]
name = "frs102disclosure"
version = "0.1.0"
description = "Automated FRS 102 financial statement reviewer"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "azure-ai-documentintelligence>=1.0.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pypdf>=6.13.2",
    "python-dotenv>=1.0",
    "voyageai>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Use a project-local tmp dir; the machine's global %TEMP%\pytest-of-* root is
# permission-locked on this box and breaks pytest's tmp_path cleanup.
addopts = "--basetemp=.pytest_tmp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "graph", "cli"]
